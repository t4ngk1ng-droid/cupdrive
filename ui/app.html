<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>cupdrive</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#161a20; --panel2:#1e242c; --line:#242a33;
    --text:#d8dee9; --dim:#7a8494; --hot:#ff4d3d; --acc:#33c6d4;
    --ok:#42d17a; --warn:#ffcc55; --err:#ff5f56;
    --vib:#33c6d4; --thr:#e0556b; --shk:#c58cff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);
    font:13px/1.45 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  button{
    background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer;
    transition:.12s;
  }
  button:hover{border-color:#3a4453;background:#28303a}
  button:disabled{opacity:.35;cursor:default}
  button.primary{border-color:var(--hot);color:var(--hot);font-weight:600}
  button.primary:hover{background:#2a1512}
  button.on{border-color:var(--ok);color:var(--ok)}

  header{
    display:flex;align-items:center;gap:9px;padding:8px 12px;
    background:var(--panel);border-bottom:1px solid var(--line);flex:none;
  }
  header .title{font-weight:600;letter-spacing:.5px}
  header .sep{width:1px;height:20px;background:var(--line)}
  header .spacer{flex:1}
  .pill{
    padding:3px 9px;border-radius:20px;background:var(--panel2);
    border:1px solid var(--line);color:var(--dim);font-size:12px;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);
       display:inline-block;margin-right:6px;vertical-align:middle}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.err{background:var(--err)}

  main{flex:1;display:flex;min-height:0;overflow:hidden}
  #left{flex:1;display:flex;flex-direction:column;min-width:0;background:#000;overflow:hidden}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;
         min-height:0;position:relative;overflow:hidden}
  video{width:100%;height:100%;object-fit:contain;outline:none;background:#000}
  #empty{color:var(--dim);text-align:center;padding:40px;line-height:2}
  #empty b{color:var(--text);font-weight:500}

  #right{
    width:336px;flex:none;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;overflow-y:auto;
  }
  .sec{padding:12px;border-bottom:1px solid var(--line)}
  .sec h3{margin:0 0 8px;font-size:11px;font-weight:600;color:var(--dim);
          letter-spacing:1px;text-transform:uppercase}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .row:last-child{margin-bottom:0}
  .row label{color:var(--dim);width:78px;flex:none;font-size:12px}
  .row .val{color:var(--dim);font-variant-numeric:tabular-nums;
            min-width:48px;text-align:right;font-size:12px}
  input[type=range]{flex:1;accent-color:var(--hot);min-width:0}
  select{
    width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:7px 8px;font:inherit;
  }
  .mini{width:100%;height:56px;display:block;border-radius:4px;
        background:var(--panel2);margin-top:8px}

  .chrow{
    display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:6px;
    background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    cursor:pointer;user-select:none;
  }
  .chrow:last-child{margin-bottom:0}
  .chrow:hover{border-color:#3a4453}
  .chrow .cd{width:10px;height:10px;border-radius:3px;flex:none}
  .chrow .cname{flex:1}
  .chrow .ccap{color:var(--dim);font-size:11px;white-space:nowrap}
  .chrow .cst{font-size:11px;color:var(--dim);min-width:28px;text-align:right}
  .chrow.on{border-color:#2d4a3a;background:#18251e}
  .chrow.on .cst{color:var(--ok)}

  .devlist{display:flex;flex-direction:column;gap:4px;margin-top:8px;
           max-height:190px;overflow-y:auto}
  .dev{
    display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:5px;
    background:var(--panel2);cursor:pointer;border:1px solid transparent;
  }
  .dev:hover{border-color:var(--line)}
  .dev .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dev .rs{color:var(--dim);font-size:11px}
  .dev.target{border-color:#3a2a12}
  .dev .star{color:var(--warn);font-size:11px}

  footer{
    flex:none;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;
  }
  .transport{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  #play{width:42px;height:42px;font-size:17px;border-radius:50%;padding:0}
  #scrub{flex:1;accent-color:var(--hot)}
  #time{font-variant-numeric:tabular-nums;color:var(--dim);
        min-width:132px;text-align:right;font-size:12px}
  #panic{
    border-color:var(--hot);color:var(--hot);font-weight:600;
    background:#241512;padding:7px 14px;
  }
  #panic:hover{background:#3a1a16}
  .bars{display:flex;flex-direction:column;gap:3px}
  .brow{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
  .brow .tag{width:48px;color:var(--dim);font-size:11px}
  .track{flex:1;height:9px;background:var(--panel2);border-radius:5px;overflow:hidden}
  .fill{height:100%;width:0;transition:width .05s linear}
  .brow .num{width:34px;text-align:right;color:var(--dim);font-size:11px}

  #toast{
    position:fixed;left:50%;bottom:120px;transform:translateX(-50%);
    background:#241512;border:1px solid var(--hot);color:var(--hot);
    padding:8px 16px;border-radius:8px;opacity:0;pointer-events:none;
    transition:opacity .2s;font-size:12px;max-width:70%;z-index:50;
  }
  #toast.show{opacity:1}
  #toast.ok{border-color:var(--ok);color:var(--ok);background:#12241a}
</style>
</head>
<body>

<header>
  <span class="title">cupdrive</span>
  <span class="sep"></span>
  <span class="pill"><span class="dot" id="dot"></span><span id="devstate">未连接</span></span>
  <span class="pill" id="bat" hidden>—</span>
  <span class="pill" id="stat">—</span>
  <span class="spacer"></span>
  <button id="btnMarker" data-i18n="calibrator" data-i18n-title="calibratorTitle"></button>
  <button id="btnImport" data-i18n="importScript" data-i18n-title="importTitle"></button>
  <button id="btnScan" data-i18n="scan" data-i18n-title="scanTitle"></button>
  <button id="btnMock" data-i18n="mockMode"></button>
  <button id="btnLang" style="min-width:38px"></button>
  <button id="btnQuit" data-i18n="quit" style="color:var(--dim)"></button>
</header>

<main>
  <div id="left">
    <div id="stage">
      <div id="empty">
        <b data-i18n="dropVideo"></b><br>
        <span data-i18n="orOpen"></span><br>
        <span data-i18n="localOnly" style="font-size:12px"></span>
      </div>
      <video id="vid" playsinline hidden></video>
    </div>
  </div>

  <div id="right">
    <div class="sec">
      <h3 data-i18n="video"></h3>
      <div class="row">
        <button id="btnOpen" data-i18n="openVideo" style="flex:1"></button>
      </div>
      <div class="row">
        <span id="vname" style="color:var(--dim);font-size:12px;overflow:hidden;
              text-overflow:ellipsis;white-space:nowrap">—</span>
      </div>
    </div>

    <div class="sec">
      <h3 data-i18n="curve"></h3>
      <select id="selCurve"></select>
      <canvas id="mini" class="mini"></canvas>
      <div class="row" style="margin-top:8px">
        <span style="color:var(--dim);font-size:12px" id="cinfo">—</span>
      </div>
    </div>

    <div class="sec">
      <h3 data-i18n="params"></h3>
      <div class="row">
        <label data-i18n="intensity"></label>
        <input type="range" id="scale" min="20" max="100" value="85">
        <span class="val" id="scaleV">85%</span>
      </div>
      <div class="row">
        <label data-i18n="lead"></label>
        <input type="range" id="offset" min="-500" max="1000" step="50" value="0">
        <span class="val" id="offsetV">0ms</span>
      </div>
      <div class="row">
        <label data-i18n="thrustLag"></label>
        <input type="range" id="lag" min="0" max="2000" step="100" value="800">
        <span class="val" id="lagV">0.8s</span>
      </div>
    </div>

    <div class="sec">
      <h3 data-i18n="channels"></h3>
      <div class="chrow on" id="ch1">
        <span class="cd" style="background:var(--vib)"></span>
        <span class="cname" data-i18n="vibration"></span>
        <span class="ccap">≤55</span>
        <span class="cst">开</span>
      </div>
      <div class="chrow" id="ch0">
        <span class="cd" style="background:var(--thr)"></span>
        <span class="cname" data-i18n="thrust"></span>
        <span class="ccap" data-i18n="capThrust"></span>
        <span class="cst">关</span>
      </div>
      <div class="chrow" id="ch2">
        <span class="cd" style="background:var(--shk)"></span>
        <span class="cname" data-i18n="shake"></span>
        <span class="ccap">≤35</span>
        <span class="cst">关</span>
      </div>
    </div>

    <div class="sec">
      <h3 data-i18n="device"></h3>
      <div class="row">
        <button id="btnDisconnect" data-i18n="disconnect" style="flex:1;font-size:12px"></button>
      </div>
      <div class="devlist" id="devlist">
        <span style="color:var(--dim);font-size:12px" data-i18n="scanHint"></span>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="transport">
    <button id="play" class="primary">▶</button>
    <input type="range" id="scrub" min="0" max="1000" value="0">
    <span id="time">00:00.0 / 00:00.0</span>
    <button id="panic" data-i18n="panic" data-i18n-title="panicTitle"></button>
  </div>
  <div class="bars">
    <div class="brow">
      <span class="tag" data-i18n="vibShort"></span>
      <div class="track"><div class="fill" id="f_vib" style="background:var(--vib)"></div></div>
      <span class="num" id="n_vib">0</span>
    </div>
    <div class="brow">
      <span class="tag" data-i18n="thrShort"></span>
      <div class="track"><div class="fill" id="f_thr" style="background:var(--thr)"></div></div>
      <span class="num" id="n_thr">0</span>
    </div>
    <div class="brow">
      <span class="tag" data-i18n="shkShort"></span>
      <div class="track"><div class="fill" id="f_shk" style="background:var(--shk)"></div></div>
      <span class="num" id="n_shk">0</span>
    </div>
  </div>
</footer>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);

const TOKEN = "__CUPR_DRIVE_TOKEN__";
const CH = {THRUST:0, VIB:1, SHK:2};
const SEND_HZ = 10;

// ── 文案 ───────────────────────────────────────────────────────
const I18N = {
  zh: {
    disconnectedState:'未连接', connectedState:'已连接', mockState:'Mock',
    calibrator:'标定台', calibratorTitle:'在浏览器打开标定台：拖视频 → ⚡全自动 → 下载 script.json',
    importScript:'导入脚本', importTitle:'选择标定台导出的 script.json，加工成可播放曲线',
    scan:'扫描设备', scanTitle:'搜索附近的 BLE 设备',
    mockMode:'Mock 模式', quit:'退出',
    video:'视频', openVideo:'打开视频', curve:'曲线', params:'参数',
    intensity:'强度', lead:'提前量', thrustLag:'伸缩滞后',
    channels:'通道（安全上限固定）', vibration:'振动', thrust:'伸缩', shake:'抖动',
    capThrust:'≤40 · 机械', on:'开', off:'关',
    device:'设备', disconnect:'断开连接', scanHint:'点「扫描设备」查找',
    panic:'紧急停止', panicTitle:'立即归零（Esc）',
    vibShort:'振动', thrShort:'伸缩', shkShort:'抖动',
    dropVideo:'把视频拖进来', orOpen:'或点右侧「打开视频」',
    localOnly:'视频只在本机解码，不上传',
    noCurves:'没有曲线', importHint:'点「导入脚本」或「标定台」',
    frames:'{n} 帧', curveInfo:'{n} 点 @ {hz}Hz · {dur}',
    loadFailed:'载入曲线失败: {err}',
    noVideo:'先打开一个视频', noCurve:'先选一条曲线',
    noDevice:'还没连设备。可以先点「Mock 模式」演练',
    beginFailed:'启动失败: {err}', playFailed:'播放失败: {err}',
    zeroed:'已归零', videoError:'视频播放出错',
    scanning:'扫描中（约 6 秒）…', noDevices:'没找到。手机 App 彻底杀掉了吗？',
    connectingTo:'连接 {name} …', connectFailed:'连接失败: {err}',
    connectedTo:'已连接 {name}', mockOn:'Mock 模式：只走时序，不连设备',
    disconnectedMsg:'已断开', deviceLost:'设备断开，已停止',
    quitConfirm:'关闭 cupdrive 服务？',
    quitDone:'cupdrive 已退出，可以关闭这个窗口。',
    confirmChannel:'{name} 是机械/强振通道，上限 {cap}。\n开启前请把手拿开。确认开启？',
    processing:'加工中…', importFailed:'加工失败: {err}',
    imported:'已导入 {name} · {dur}', hasMotion:' · 含画面融合',
    autoCurve:'已自动匹配曲线 {name}',
    lengthMismatch:'视频 {v} / 曲线 {c}，长度不一致',
  },
  en: {
    disconnectedState:'Disconnected', connectedState:'Connected', mockState:'Mock',
    calibrator:'Calibrator', calibratorTitle:'Open the curve editor in your browser',
    importScript:'Import script', importTitle:'Pick a script.json exported by the calibrator',
    scan:'Scan devices', scanTitle:'Scan for nearby BLE devices',
    mockMode:'Mock mode', quit:'Quit',
    video:'Video', openVideo:'Open video', curve:'Curve', params:'Parameters',
    intensity:'Intensity', lead:'Lead', thrustLag:'Thrust lag',
    channels:'Channels (hard caps)', vibration:'Vibration', thrust:'Thrust', shake:'Shake',
    capThrust:'≤40 · mechanical', on:'On', off:'Off',
    device:'Device', disconnect:'Disconnect', scanHint:'Click "Scan devices"',
    panic:'STOP', panicTitle:'Zero immediately (Esc)',
    vibShort:'Vib', thrShort:'Thrust', shkShort:'Shake',
    dropVideo:'Drop a video here', orOpen:'or click "Open video" on the right',
    localOnly:'Decoded locally. Nothing is uploaded.',
    noCurves:'No curves', importHint:'Import a script or use the calibrator',
    frames:'{n} frames', curveInfo:'{n} points @ {hz} Hz · {dur}',
    loadFailed:'Failed to load curve: {err}',
    noVideo:'Open a video first', noCurve:'Pick a curve first',
    noDevice:'No device connected. Try "Mock mode" first.',
    beginFailed:'Could not start: {err}', playFailed:'Playback failed: {err}',
    zeroed:'Zeroed', videoError:'Video playback error',
    scanning:'Scanning (about 6 s)…', noDevices:'Nothing found. Is the phone app still running?',
    connectingTo:'Connecting to {name}…', connectFailed:'Connect failed: {err}',
    connectedTo:'Connected to {name}', mockOn:'Mock mode: timeline only, no BLE',
    disconnectedMsg:'Disconnected', deviceLost:'Device disconnected — playback stopped',
    quitConfirm:'Quit cupdrive?',
    quitDone:'cupdrive has quit. You can close this window.',
    confirmChannel:'{name} is a mechanical channel, capped at {cap}.\nKeep your hands clear. Enable it?',
    processing:'Tuning…', importFailed:'Tune failed: {err}',
    imported:'Imported {name} · {dur}', hasMotion:' · with motion blend',
    autoCurve:'Auto-matched curve {name}',
    lengthMismatch:'Video {v} / curve {c} — lengths differ',
  },
};

let LANG = localStorage.getItem('cupdrive.lang') ||
           ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');

function T(key, vars={}){
  const table = I18N[LANG] || I18N.zh;
  let s = table[key] ?? I18N.zh[key] ?? key;
  for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}

let curve = null;          // {b, hz, duration, name, source}
let curveItems = [];
let playing = false;
let playGen = 0;           // 服务端播放会话代号
let raf = 0;
let sendTimer = 0;
let lastBars = 0;
let connected = false;
let mock = false;

// 通道开关：默认只开振动。机械通道必须显式确认。
const chans = {0:false, 1:true, 2:false};

const vid = $('#vid');

// ── 语言 ───────────────────────────────────────────────────────
function applyLangText(){
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = T(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = T(el.dataset.i18nTitle);
  });
  $('#btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  $('#btnLang').title = LANG === 'zh' ? 'Switch to English' : '切换到中文';
}

async function setLang(lang){
  LANG = lang;
  localStorage.setItem('cupdrive.lang', LANG);
  applyLangText();
  setDevState();
  renderChans();
  await loadCurveList(curve ? curve.path : null);
}

// ── HTTP 桥 ────────────────────────────────────────────────────
async function call(method, params={}){
  const r = await fetch('/api/' + method, {
    method: 'POST',
    headers: {'Content-Type': 'application/json',
              'X-Cupdrive-Token': TOKEN},
    body: JSON.stringify(params),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

async function getJSON(path){
  const r = await fetch(path, {headers: {'X-Cupdrive-Token': TOKEN}});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

// ── 提示 ───────────────────────────────────────────────────────
let toastTimer = 0;
function toast(msg, ok=false){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (ok ? ' ok' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 2800);
}

function setText(el, text, color){
  el.innerHTML = '';
  const s = document.createElement('span');
  s.style.cssText = 'font-size:12px' + (color ? ';color:' + color : ';color:var(--dim)');
  s.textContent = text;
  el.appendChild(s);
}

// ── 状态 ───────────────────────────────────────────────────────
function setDevState(){
  const dot = $('#dot'), txt = $('#devstate');
  if (mock){ dot.className = 'dot ok'; txt.textContent = T('mockState'); return; }
  if (connected){ dot.className = 'dot ok'; txt.textContent = T('connectedState'); return; }
  dot.className = 'dot'; txt.textContent = T('disconnectedState');
}

async function refreshStatus(){
  let s;
  try{ s = await call('status'); }catch(e){ return; }
  const was = connected;
  connected = !!s.connected;
  mock = !!s.mock;
  setDevState();

  $('#stat').textContent = T('frames', {n: s.sent});
  $('#bat').hidden = (s.battery == null);
  if (s.battery != null)
    $('#bat').textContent = `${s.battery.toFixed(0)}% ${s.volt ? s.volt.toFixed(2)+'V' : ''}`;

  if (s.error) toast(s.error);

  // 播放中掉线 → 立刻停
  if (playing && was && !connected && !mock){
    pausePlayback(true);
    toast(T('deviceLost'));
  }
  setBars(s.last);
}

function setBars(v){
  const map = [[1,'vib'],[0,'thr'],[2,'shk']];
  for (const [ch, id] of map){
    const x = (v && v[ch]) || 0;
    $('#f_'+id).style.width = Math.max(0, Math.min(100, x)) + '%';
    $('#n_'+id).textContent = Math.round(x);
  }
}

// ── 格式化 ─────────────────────────────────────────────────────
function fmt(t){
  t = (isFinite(t) && t > 0) ? t : 0;   // WebM 可能报 Infinity/NaN
  const m = Math.floor(t/60), s = t - m*60;
  return `${String(m).padStart(2,'0')}:${s.toFixed(1).padStart(4,'0')}`;
}

// ── 曲线 ───────────────────────────────────────────────────────
async function loadCurveList(selectPath=null){
  try{ curveItems = await getJSON('/api/list_curves'); }catch(e){ curveItems = []; }
  const sel = $('#selCurve');
  sel.innerHTML = '';
  if (!curveItems.length){
    sel.innerHTML = '<option value="">' + T('noCurves') + '</option>';
    $('#cinfo').textContent = T('importHint');
    curve = null;
    drawMini();
    return;
  }
  for (const it of curveItems){
    const o = document.createElement('option');
    o.value = it.path;
    o.textContent = `${it.name}  ·  ${fmt(it.duration)}`;
    sel.appendChild(o);
  }
  const pick = selectPath || sel.value || curveItems[0].path;
  sel.value = pick;
  await selectCurve(pick);
}

async function selectCurve(path){
  if (!path) return;
  try{ curve = await call('load_curve', {path}); }
  catch(e){ toast(T('loadFailed', {err: e})); return; }
  $('#cinfo').textContent = T('curveInfo', {
    n: curve.b.length, hz: curve.hz, dur: fmt(curve.duration)});
  $('#scrub').value = 0;
  drawMini();
  updateTime();
}

function curveBySource(filename){
  if (!filename) return null;
  const base = filename.split(/[\\/]/).pop().toLowerCase();
  return curveItems.find(it => (it.source || '').split(/[\\/]/).pop().toLowerCase() === base)
      || curveItems.find(it => base.replace(/\.[^.]+$/,'') ===
                               (it.name || '').replace(/\.tuned\.json$/,'').toLowerCase())
      || null;
}

// ── mini 曲线 ──────────────────────────────────────────────────
function drawMini(progress=0){
  const c = $('#mini');
  const g = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr;
  c.height = c.clientHeight * dpr;
  g.scale(dpr, dpr);
  const W = c.clientWidth, H = c.clientHeight;
  g.clearRect(0,0,W,H);
  if (!curve || !curve.b.length) return;

  g.beginPath();
  const n = curve.b.length;
  for (let x = 0; x < W; x++){
    const i = Math.min(n-1, Math.floor(x * n / W));
    const y = H - (curve.b[i]/100) * (H-2) - 1;
    x === 0 ? g.moveTo(x,y) : g.lineTo(x,y);
  }
  g.strokeStyle = 'rgba(51,198,212,.8)';
  g.lineWidth = 1;
  g.stroke();

  if (progress > 0){
    g.fillStyle = 'rgba(255,255,255,.13)';
    g.fillRect(0, 0, W * Math.min(1, progress), H);
  }
}

// ── 播放 ───────────────────────────────────────────────────────
function updateTime(){
  const vd = (isFinite(vid.duration) && vid.duration > 0) ? vid.duration : 0;
  const d = vd || (curve ? curve.duration : 0);
  $('#time').textContent = `${fmt(vid.currentTime)} / ${fmt(d)}`;
  if (vd){
    $('#scrub').value = Math.round(vid.currentTime / vd * 1000);
  }
}

// 发送走独立定时器：rAF 在窗口切后台时会被节流到 ~2Hz，
// 导致设备动作断断续续。UI 刷新仍用 rAF。
function tick(){
  if (!playing) return;
  const now = performance.now();
  if (now - lastBars >= 120){
    lastBars = now;
    updateTime();
    drawMini(isFinite(vid.duration) && vid.duration > 0
             ? vid.currentTime / vid.duration : 0);
  }
  raf = requestAnimationFrame(tick);
}

function sendAt(t){
  if (!curve || !curve.b.length || !playGen) return;
  const hz = curve.hz || 10;
  const offset = (+$('#offset').value) / 1000;
  const lag = (+$('#lag').value) / 1000;
  const scale = (+$('#scale').value) / 100;
  const n = curve.b.length;

  const vals = [0,0,0,0];
  for (const k of Object.keys(chans)){
    if (!chans[k]) continue;
    const ch = +k;
    const ii = Math.round((t + offset - (ch === CH.THRUST ? lag : 0)) * hz);
    vals[ch] = (ii < 0 || ii >= n) ? 0 : Math.max(0, Math.min(100, curve.b[ii] * scale));
  }
  call('send', {v0: vals[0], v1: vals[1], v2: vals[2], v3: vals[3],
                gen: playGen}).catch(()=>{});
  setBars(vals);
}

function startSendTimer(){
  clearInterval(sendTimer);
  sendTimer = setInterval(() => {
    if (playing && playGen) sendAt(vid.currentTime);
  }, 1000 / SEND_HZ);
}

function stopSendTimer(){
  clearInterval(sendTimer);
  sendTimer = 0;
}

async function startPlayback(){
  if (!vid.src){ toast(T('noVideo')); return; }
  if (!curve){ toast(T('noCurve')); return; }

  await refreshStatus();
  if (!mock && !connected){
    toast(T('noDevice'));
    return;
  }
  let r;
  try{ r = await call('begin'); }
  catch(e){ toast(T('beginFailed', {err: e})); return; }
  playGen = r.gen;

  playing = true;
  $('#play').textContent = '❚❚';
  try{
    await vid.play();
  }catch(e){
    playing = false; playGen = 0;
    $('#play').textContent = '▶';
    call('stop').catch(()=>{});
    toast(T('playFailed', {err: e}));
    return;
  }
  startSendTimer();
  tick();
}

function pausePlayback(silent=false){
  playing = false;
  playGen = 0;
  $('#play').textContent = '▶';
  cancelAnimationFrame(raf);
  stopSendTimer();
  try{ vid.pause(); }catch(e){}
  call('stop').catch(()=>{});
  setBars([0,0,0,0]);
  if (!silent) refreshStatus();
}

async function panic(){
  playing = false;
  playGen = 0;
  $('#play').textContent = '▶';
  cancelAnimationFrame(raf);
  stopSendTimer();
  try{ vid.pause(); }catch(e){}
  try{ await call('panic'); }catch(e){}
  setBars([0,0,0,0]);
  toast(T('zeroed'), true);
}

// ── 设备 ───────────────────────────────────────────────────────
async function scan(){
  const box = $('#devlist');
  setText(box, T('scanning'));
  let r;
  try{ r = await call('scan', {sec: 6}); }
  catch(e){ setText(box, String(e), 'var(--err)'); return; }
  box.innerHTML = '';
  if (!r.devices || !r.devices.length){
    setText(box, T('noDevices'));
    return;
  }
  for (const d of r.devices){
    if (!d.name) continue;
    const el = document.createElement('div');
    el.className = 'dev' + (d.target ? ' target' : '');
    // 广播名来自外部设备，只能当文本用，不能进 innerHTML。
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = d.name;
    const rs = document.createElement('span');
    rs.className = 'rs';
    rs.textContent = d.rssi == null ? '' : d.rssi + ' dBm';
    el.appendChild(nm);
    el.appendChild(rs);
    if (d.target){
      const st = document.createElement('span');
      st.className = 'star';
      st.textContent = '★';
      el.appendChild(st);
    }
    el.onclick = () => connect(d.address, d.name);
    box.appendChild(el);
  }
}

async function connect(address, name){
  toast(T('connectingTo', {name}));
  let r;
  try{ r = await call('connect', {address, name}); }
  catch(e){ toast(T('connectFailed', {err: e})); return; }
  if (r.ok){
    pausePlayback(true);
    mock = false; connected = true;
    setDevState();
    toast(T('connectedTo', {name}), true);
    await refreshStatus();
  } else {
    toast(T('connectFailed', {err: r.error || ''}));
  }
}

async function useMock(){
  pausePlayback(true);
  try{ await call('mock'); }catch(e){}
  mock = true; connected = true;
  setDevState();
  toast(T('mockOn'), true);
}

// ── 通道 ───────────────────────────────────────────────────────
async function applyParams(){
  const list = Object.keys(chans).filter(k => chans[k]).join(',') || '1';
  try{ await call('set_params', {chans: list}); }catch(e){}
}

function renderChans(){
  for (const ch of [0,1,2]){
    const el = $('#ch' + ch);
    el.classList.toggle('on', !!chans[ch]);
    el.querySelector('.cst').textContent = chans[ch] ? T('on') : T('off');
  }
}

async function toggleChan(ch){
  if (ch !== CH.VIB && !chans[ch]){
    const names = {0: T('thrust'), 2: T('shake')};
    const caps = {0: 40, 2: 35};
    if (!confirm(T('confirmChannel', {name: names[ch], cap: caps[ch]})))
      return;
  }
  chans[ch] = !chans[ch];
  if (!chans[0] && !chans[1] && !chans[2]) chans[CH.VIB] = true;
  renderChans();
  playGen = 0;
  stopSendTimer();
  await applyParams();
}

// ── 导入脚本 ───────────────────────────────────────────────────
async function importScript(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0];
    if (!f) return;
    const btn = $('#btnImport');
    btn.disabled = true;
    btn.textContent = T('processing');
    let r;
    try{
      const text = await f.text();
      r = await call('import_data', {name: f.name, text});
    }catch(e){
      r = {ok: false, error: String(e)};
    }
    btn.disabled = false;
    btn.textContent = T('importScript');
    if (!r.ok){ toast(T('importFailed', {err: r.error || ''})); return; }
    await loadCurveList(r.path);
    toast(T('imported', {name: r.name, dur: fmt(r.duration)}) +
          (r.has_mv ? T('hasMotion') : ''), true);
  };
  inp.click();
}

// ── 视频 ───────────────────────────────────────────────────────
function setVideoFile(f){
  if (!f) return;
  if (vid.src) URL.revokeObjectURL(vid.src);
  vid.src = URL.createObjectURL(f);
  vid.hidden = false;
  $('#empty').hidden = true;
  $('#vname').textContent = f.name;
  vid.load();

  const hit = curveBySource(f.name);
  if (hit && hit.path !== $('#selCurve').value){
    $('#selCurve').value = hit.path;
    selectCurve(hit.path);
    toast(T('autoCurve', {name: hit.name}), true);
  }
}

// ── 事件 ───────────────────────────────────────────────────────
$('#btnOpen').onclick = () => {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'video/*';
  inp.onchange = () => setVideoFile(inp.files[0]);
  inp.click();
};

$('#btnScan').onclick = scan;
$('#btnMock').onclick = useMock;
$('#btnMarker').onclick = () => window.open('/marker', '_blank');
$('#btnImport').onclick = importScript;
$('#play').onclick = () => playing ? pausePlayback() : startPlayback();
$('#panic').onclick = panic;

$('#btnLang').onclick = () => setLang(LANG === 'zh' ? 'en' : 'zh');

$('#btnDisconnect').onclick = async () => {
  try{ await call('disconnect'); }catch(e){}
  connected = false; mock = false;
  setDevState();
  setBars([0,0,0,0]);
  toast(T('disconnectedMsg'));
};

$('#btnQuit').onclick = async () => {
  if (!confirm(T('quitConfirm'))) return;
  try{ await call('quit'); }catch(e){}
  document.body.innerHTML = '';
  const d = document.createElement('div');
  d.style.cssText = 'margin:auto;color:#7a8494;font:14px system-ui';
  d.textContent = T('quitDone');
  document.body.appendChild(d);
};

$('#selCurve').onchange = e => selectCurve(e.target.value);

$('#scrub').oninput = e => {
  if (!vid.duration) return;
  vid.currentTime = e.target.value / 1000 * vid.duration;
  updateTime();
  drawMini(e.target.value / 1000);
};

$('#scale').oninput = e => $('#scaleV').textContent = e.target.value + '%';
$('#offset').oninput = e => $('#offsetV').textContent = e.target.value + 'ms';
$('#lag').oninput = e => $('#lagV').textContent =
  (e.target.value / 1000).toFixed(1) + 's';

for (const ch of [0,1,2]) $('#ch' + ch).onclick = () => toggleChan(ch);

vid.onended = () => {
  playing = false;
  playGen = 0;
  $('#play').textContent = '▶';
  cancelAnimationFrame(raf);
  stopSendTimer();
  call('stop').catch(()=>{});
  setBars([0,0,0,0]);
  updateTime();
};

// 缓冲 / 拖动 / 解码出错时停止续租，恢复播放后再继续。
vid.onwaiting = () => { if (playing) stopSendTimer(); };
vid.onplaying = () => { if (playing && playGen) startSendTimer(); };
vid.onerror = () => {
  if (playing){ pausePlayback(true); toast(T('videoError')); }
};

vid.onloadedmetadata = () => {
  updateTime();
  const vd = (isFinite(vid.duration) && vid.duration > 0) ? vid.duration : 0;
  if (curve && vd && Math.abs(vd - curve.duration) > 1.0){
    toast(T('lengthMismatch', {v: fmt(vd), c: fmt(curve.duration)}));
  }
};

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const f = [...e.dataTransfer.files].find(f => f.type.startsWith('video/'));
  if (f) setVideoFile(f);
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === ' '){ e.preventDefault(); playing ? pausePlayback() : startPlayback(); }
  else if (e.key === 'Escape'){ e.preventDefault(); panic(); }
});

window.addEventListener('beforeunload', () => {
  // 关页面时尽力归零；服务端看门狗和空闲超时兜底
  try{
    navigator.sendBeacon('/api/panic?token=' + encodeURIComponent(TOKEN));
  }catch(e){}
});

// ── 启动 ───────────────────────────────────────────────────────
(async function init(){
  applyLangText();
  renderChans();
  await applyParams();
  await loadCurveList();
  await refreshStatus();
  setInterval(refreshStatus, 500);
})();
</script>
